    - Zbot Overview: tutorials/zbot-overview.md
    - Zbot Model (SDF Geometry): tutorials/zbot-model.md
    - Zbot Swimming Experiment (YAML Walkthrough): tutorials/zbot-experiment.md
    - Zbot Custom CPG Controller (Step-by-Step): tutorials/zbot-custom-controller.md
  - How-to Guides:
    - Configure an Experiment YAML: how-to/configure-yaml.md
    - Add and Configure Sensors: how-to/configure-sensors.md
    - Write an AnimatExtension: how-to/write-extension.md
    - Write a Controller: how-to/write-controller.md
    - Configure CPG Network Parameters: how-to/configure-cpg-network.md
