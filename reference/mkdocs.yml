site_name: FARMS Documentation
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables
nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - SSH Key Setup: ssh_setup.md
    - Simulation Walkthrough: walkthrough.md
  - Module Guides:
    - farms_core: farms_core.md
    - farms_sim: farms_sim.md
    - farms_mujoco: farms_mujoco.md
    - farms_amphibious: farms_amphibious.md
  - Zbot Robot:
    - Overview: zbot/index.md
    - Model: zbot/model.md
    - Swimming Experiment: zbot/experiment.md
    - Custom CPG Controller: zbot/cpg_controller.md
  - Architecture & Design:
    - System Architecture: architecture.md
    - Mathematical Models: mathematical_models.md
    - Core Interfaces: core_interfaces.md
  - Reference:
    - Configuration Reference: configuration.md
    - Glossary: glossary.md
    - Contributing: contributing.md
  - API Reference:
    - Overview: api/index.md
    - farms_core:
      - Controller & Extension Interfaces: api/farms_core_control.md
      - Sensor Data Arrays: api/farms_core_sensors.md
      - Options Hierarchy: api/farms_core_options.md
      - I/O Utilities: api/farms_core_io.md
    - farms_mujoco:
      - MuJoCo Simulation & Extensions: api/farms_mujoco_simulation.md
      - Hydrodynamic Swimming Model: api/farms_mujoco_swimming.md
    - farms_amphibious:
      - CPG Oscillator Network: api/cpg_oscillators.md
      - Ekeberg Muscle Model: api/ekeberg_muscle.md
      - Joint Controllers: api/joint_controllers.md
      - Amphibious Controller: api/farms_amphibious_controller.md
      - Network ODE Integrator: api/farms_amphibious_network.md
      - Descending Drive: api/farms_amphibious_drive.md
      - Amphibious Data Classes: api/farms_amphibious_data.md
      - Amphibious Options: api/farms_amphibious_options.md
    - Zbot Guides:
      - Custom CPG Controller: api/cpg_controller.md
      - Swimming Experiment: api/experiment.md
      - Zbot Model: api/model.md