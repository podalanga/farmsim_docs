site_name: FarmSim Documentation
site_description: Documentation of FarmSim, the simulation packages of FARMS (Framework for Animal and Robot Modeling and Simulation)
site_url: https://podalanga.github.io/farmsim_docs/
repo_url: https://github.com/podalanga/farmsim_docs
repo_name: podalanga/farmsim_docs
edit_uri: edit/main/reference/docs/
copyright: >-
  <a href="/farmsim_docs/help/license/">Licenses</a> ·
  <a href="/farmsim_docs/help/cite/">How to cite</a> ·
  <a href="https://github.com/podalanga/farmsim_docs/issues">Report a docs issue</a>
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true  # Generated pages have no git history
      exclude:  # Generated pages
        - reference/api/*
        - reference/env/configuration-reference.md
        - reference/env/cli.md
  - redirects:
      redirect_maps:
        reference/env/data-model.md: explanation/data-flow.md
        reference/core/core-interfaces.md: explanation/extension-design.md
        reference/core/extension-api.md: explanation/extension-design.md
        explanation/architecture-diagrams.md: explanation/architecture.md
        explanation/codebase-walkthrough.md: explanation/architecture.md
        tutorials/install-and-run.md: get-started/installation.md
        tutorials/zbot-overview.md: projects/zbot/index.md
        tutorials/zbot-model.md: projects/zbot/model.md
        tutorials/zbot-experiment.md: projects/zbot/experiment.md
        tutorials/zbot-custom-controller.md: projects/zbot/custom-controller.md
        reference/env/glossary.md: help/glossary.md
        how-to/contributing.md: help/contributing.md
  - gen-files:
      scripts:
        - tools/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: auto
            docstring_options:
              default: sphinx
              per_style_options:
                sphinx:
                  warnings: false
                numpy:
                  warnings: false
                google:
                  warnings: false
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
            heading_level: 2
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/podalanga/farms_zbot
      name: farms_zbot on GitHub
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Get started:
    - Overview: get-started/index.md
    - Installation: get-started/installation.md
    - Supported platforms: get-started/platforms.md
  - Tutorials:
    - tutorials/index.md
    - 1. Your first simulation: tutorials/first-simulation.md
    - 2. Understand the experiment files: tutorials/experiment-files.md
    - 3. Trace a simulation step: tutorials/simulation-workflow.md
    - 4. Write a custom controller: tutorials/custom-controller.md
    - 5. Swimming and buoyancy: tutorials/swimming.md
    - 6. Record, load and plot data: tutorials/record-and-plot.md
  - How-to guides:
    - Configure an experiment YAML: how-to/configure-yaml.md
    - Add and configure sensors: how-to/configure-sensors.md
    - Write an AnimatExtension: how-to/write-extension.md
    - Write a controller: how-to/write-controller.md
    - Configure the CPG network: how-to/configure-cpg-network.md
    - Use the built-in extensions: how-to/use-extensions.md
    - Save, load and inspect data: how-to/save-load-data.md
    - Plug into FARMS modules: how-to/plug-into-farms.md
    - Bring your own robot: how-to/own-robot.md
  - Reference:
    - Environment and config:
      - CLI reference: reference/env/cli.md
      - YAML configuration schema: reference/env/yaml-schema.md
      - Configuration parameters: reference/env/configuration-reference.md
    - farms_core:
      - Package overview: reference/core/farms-core.md
      - Control: reference/core/core-control.md
      - Options: reference/core/core-options.md
      - I/O (SDF, HDF5, YAML): reference/core/core-io.md
      - Sensors: reference/core/core-sensors.md
    - farms_amphibious:
      - Package overview: reference/amphibious/farms-amphibious.md
      - CPG oscillators: reference/amphibious/cpg-oscillators.md
      - NetworkODE: reference/amphibious/network-ode.md
      - Ekeberg muscle model: reference/amphibious/ekeberg-muscle.md
      - Joint controllers: reference/amphibious/joint-controllers.md
      - AmphibiousController: reference/amphibious/amphibious-controller.md
      - Data: reference/amphibious/amphibious-data.md
      - Options: reference/amphibious/amphibious-options.md
      - Descending drive: reference/amphibious/descending-drive.md
    - farms_mujoco:
      - Package overview: reference/mujoco/farms-mujoco.md
      - Simulation: reference/mujoco/mujoco-simulation.md
      - Swimming: reference/mujoco/mujoco-swimming.md
    - farms_sim:
      - Package overview: reference/sim/farms-sim.md
    - API (generated): reference/api/
  - Explanation:
    - System architecture: explanation/architecture.md
    - Simulation lifecycle: explanation/simulation-lifecycle.md
    - Mathematical models: explanation/mathematical-models.md
    - Options and YAML design: explanation/options-yaml-design.md
    - Extension and controller design: explanation/extension-design.md
    - Data flow and persistence: explanation/data-flow.md
    - CPG control architecture: explanation/cpg-architecture.md
  - Internals:
    - Naming and indexing convention: internals/amphibious-convention.md
    - CPG integration: internals/ode-internals.md
    - Cython equation handlers: internals/cython-equation-handlers.md
    - ExperimentTask: internals/experiment-task-internals.md
    - MJCF builder: internals/mjcf-builder-internals.md
    - Hydrodynamics and swimming: internals/hydrodynamics-internals.md
    - Data allocation and serialization: internals/data-allocation-internals.md
    - Options and YAML deserialization: internals/options-yaml-internals.md
    - Descending drive and feedback: internals/descending-drive-internals.md
    - Physics sensor mapping: internals/physics-sensor-mapping.md
  - Projects:
    - projects/index.md
    - Zbot:
      - Overview: projects/zbot/index.md
      - Install the Zbot workspace: projects/zbot/install.md
      - Model: projects/zbot/model.md
      - Swimming experiment: projects/zbot/experiment.md
      - Custom CPG controller: projects/zbot/custom-controller.md
  - Help:
    - Troubleshooting: help/troubleshooting.md
    - FAQ: help/faq.md
    - Glossary: help/glossary.md
    - What's new: help/changelog.md
    - How to cite: help/cite.md
    - License: help/license.md
    - Contributing: help/contributing.md
