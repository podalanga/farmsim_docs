# Copy to .github/workflows/notify-docs.yml in farms_zbot (and optionally in
# the FARMS repositories) to rebuild the documentation whenever the code
# changes. Requires a repository secret DOCS_DISPATCH_TOKEN: a fine-grained
# personal access token with "Contents: read and write" access to
# podalanga/farmsim_docs (needed to send repository_dispatch events).
name: Notify documentation

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the documentation build
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/podalanga/farmsim_docs/dispatches \
            -f event_type=code-updated \
            -f "client_payload[source]=${{ github.repository }}" \
            -f "client_payload[zbot_ref]=${{ github.repository == 'podalanga/farms_zbot' && github.ref_name || 'main' }}"
